name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aut_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: aut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: sqlite://
      TEST_POSTGRES_URL: postgresql+psycopg://aut_test:test-only-password@localhost:5432/aut_test
      LLM_PROVIDER: byteplus
      MOCK_MODE: "true"
      JWT_SECRET: test-only-secret
      ASYNC_PROCESSING_ENABLED: "false"
      SURVEY_SESSION_REQUIRED: "false"
      PARTICIPANT_TOKEN_REQUIRED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
