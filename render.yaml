services:
  - type: web
    name: aut-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: byteplus
      - key: BYTEPLUS_API_KEY
        sync: false
      - key: BYTEPLUS_BASE_URL
        value: https://ark.ap-southeast.bytepluses.com/api/v3
      - key: BYTEPLUS_MODEL
        value: glm-5-3-flash-260828
      - key: BYTEPLUS_REASONING_EFFORT
        value: minimal
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_REASONING_EFFORT
        value: none
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_MODEL
        value: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      - key: CLOUDFLARE_MAX_TOKENS
        value: "8192"
      - key: EMBEDDING_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_EMBEDDING_MODEL
        value: "@cf/qwen/qwen3-embedding-0.6b"
      - key: EMBEDDING_BATCH_SIZE
        value: "64"
      - key: EMBEDDING_TIMEOUT_SECONDS
        value: "20"
      - key: CODE_CANDIDATE_LIMIT
        value: "3"
      - key: CODEBOOK_FULL_SCAN_LIMIT
        value: "20"
      - key: REFERENCE_CASES_ENABLED
        value: "true"
      - key: REFERENCE_CASES_LIMIT
        value: "2"
      - key: REFERENCE_CASES_MAX_CHARS
        value: "2200"
      - key: AUTO_MATCH_RETRIEVAL_FLOOR
        value: "0.60"
      - key: AUTO_MATCH_SEMANTIC_FLOOR
        value: "0.70"
      - key: AUTO_MATCH_MARGIN_FLOOR
        value: "0.08"
      - key: AUTO_MATCH_GOAL_FLOOR
        value: "0.20"
      - key: AUTO_MATCH_STRUCTURAL_FLOOR
        value: "0.20"
      - key: CHALLENGED_MATCH_RETRIEVAL_FLOOR
        value: "0.50"
      - key: CHALLENGED_MATCH_SEMANTIC_FLOOR
        value: "0.70"
      - key: CHALLENGED_MATCH_MARGIN_FLOOR
        value: "0.08"
      - key: MOCK_MODE
        value: false
      - key: ASYNC_PROCESSING_ENABLED
        value: true
      - key: SURVEY_SESSION_REQUIRED
        value: true
      - key: PARTICIPANT_TOKEN_REQUIRED
        value: true
      - key: SURVEY_DATA_SOURCE
        value: PILOT
      - key: SURVEY_GRACE_SECONDS
        value: "60"
      - key: RESOLVER_MAX_ATTEMPTS
        value: "3"
      - key: AUTO_CODE_AUDIT_ENABLED
        value: true
      - key: PROCESSING_WORKER_COUNT
        value: "2"
      - key: SUBMIT_WAIT_SECONDS
        value: "240"
      - key: SUBMIT_WAIT_POLL_SECONDS
        value: "0.5"
      - key: LLM_EXTRACTION_MAX_TOKENS
        value: "3072"
      - key: LLM_CURATOR_MAX_TOKENS
        value: "3072"
      - key: LLM_CHALLENGER_MAX_TOKENS
        value: "3072"
      - key: LLM_SCORING_MAX_TOKENS
        value: "3072"
      - key: LLM_AUX_MAX_TOKENS
        value: "3072"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: STORE_RAW_LLM_RESPONSE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAPPING_TEMPERATURE
        value: "0.1"
      - key: SCORING_TEMPERATURE
        value: "0.4"
      - key: SCORING_RUNS
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
