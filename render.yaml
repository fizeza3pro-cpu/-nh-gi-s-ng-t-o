services:
  - type: web
    name: aut-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: byteplus
      - key: BYTEPLUS_API_KEY
        sync: false
      - key: BYTEPLUS_BASE_URL
        value: https://ark.ap-southeast.bytepluses.com/api/v3
      - key: BYTEPLUS_MODEL
        value: deepseek-v4-pro-ga-260813
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_REASONING_EFFORT
        value: none
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_MODEL
        value: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      - key: CLOUDFLARE_MAX_TOKENS
        value: "8192"
      - key: EMBEDDING_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_EMBEDDING_MODEL
        value: "@cf/qwen/qwen3-embedding-0.6b"
      - key: EMBEDDING_BATCH_SIZE
        value: "64"
      - key: EMBEDDING_TIMEOUT_SECONDS
        value: "20"
      - key: CODE_CANDIDATE_LIMIT
        value: "8"
      - key: CODEBOOK_FULL_SCAN_LIMIT
        value: "20"
      - key: REFERENCE_CASES_ENABLED
        value: "true"
      - key: REFERENCE_CASES_LIMIT
        value: "2"
      - key: REFERENCE_CASES_MAX_CHARS
        value: "2200"
      - key: MOCK_MODE
        value: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAPPING_TEMPERATURE
        value: "0.1"
      - key: SCORING_TEMPERATURE
        value: "0.4"
      - key: SCORING_RUNS
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
